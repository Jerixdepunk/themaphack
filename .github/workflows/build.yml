name: Build Themaphack NDK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target architecture (arm64-v8a or armeabi-v7a)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a

env:
  NDK_VERSION: r25b  # Stable NDK version that works with your project
  TARGET_ARCH: ${{ github.event.inputs.architecture || 'arm64-v8a' }}
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Increased timeout for complex builds

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b
        add-to-path: true
        local-cache: true

    - name: Verify NDK installation
      run: |
        echo "NDK Path: $ANDROID_NDK_HOME"
        ls -la $ANDROID_NDK_HOME/ndk-build
        echo "NDK version:"
        $ANDROID_NDK_HOME/ndk-build --version

    - name: Create build directories
      run: |
        mkdir -p libs/${TARGET_ARCH}
        mkdir -p obj/local/${TARGET_ARCH}

    - name: Build with ndk-build (Debug Mode)
      run: |
        # Change to jni directory where Android.mk and Application.mk are located
        cd jni
        
        # Run ndk-build with verbose logging
        $ANDROID_NDK_HOME/ndk-build \
          NDK_PROJECT_PATH=. \
          APP_BUILD_SCRIPT=./Android.mk \
          NDK_APPLICATION_MK=./Application.mk \
          APP_ABI=${TARGET_ARCH} \
          APP_PLATFORM=android-21 \
          APP_BUILD_TYPE=Debug \
          NDK_OUT=../obj/local/${TARGET_ARCH} \
          NDK_LIBS_OUT=../libs/${TARGET_ARCH} \
          NDK_LOG=1 \
          V=1

    - name: Build with ndk-build (Release Mode)
      run: |
        # Change to jni directory where Android.mk and Application.mk are located
        cd jni
        
        # Run ndk-build in release mode
        $ANDROID_NDK_HOME/ndk-build \
          NDK_PROJECT_PATH=. \
          APP_BUILD_SCRIPT=./Android.mk \
          NDK_APPLICATION_MK=./Application.mk \
          APP_ABI=${TARGET_ARCH} \
          APP_PLATFORM=android-21 \
          APP_BUILD_TYPE=Release \
          NDK_OUT=../obj/local/${TARGET_ARCH} \
          NDK_LIBS_OUT=../libs/${TARGET_ARCH} \
          V=1

    - name: Verify build artifacts
      run: |
        echo "Build artifacts in libs/${TARGET_ARCH}:"
        ls -la libs/${TARGET_ARCH}/
        
        # Check if the main library was built
        if [ -f "libs/${TARGET_ARCH}/libAkSoundEngine2.so" ]; then
          echo "✅ Build successful! libAkSoundEngine2.so found."
        else
          echo "❌ Build failed! libAkSoundEngine2.so not found."
          echo "Listing all files in libs directory:"
          find libs/ -type f -name "*.so"
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: themaphack-${{ env.TARGET_ARCH }}-${{ github.sha }}
        path: |
          libs/${{ env.TARGET_ARCH }}/
          obj/local/${{ env.TARGET_ARCH }}/
        retention-days: 30

    - name: Create GitHub Release (on main branch)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          libs/${{ env.TARGET_ARCH }}/libAkSoundEngine2.so
        tag_name: v${{ github.run_number }}-${{ env.TARGET_ARCH }}
        name: Release ${{ env.TARGET_ARCH }} ${{ github.run_number }}
        body: |
          ## Themaphack Build ${{ github.run_number }}
          
          **Architecture:** ${{ env.TARGET_ARCH }}
          **Commit:** ${{ github.sha }}
          **Date:** ${{ github.event.head_commit.timestamp }}
          
          ### Installation
          1. Download the appropriate `libAkSoundEngine2.so` file
          2. Copy to `Android/data/com.mobile.legends/files/dragon2017/assets/comlibs/${{ env.TARGET_ARCH }}/`
          3. Rename original `libAkSoundEngine.bytes` to `libTMH.bytes`
          4. Rename `libAkSoundEngine2.so` to `libAkSoundEngine.bytes`
          5. Generate a key from [themaphack.com](https://themaphack.com) 【turn1search2】
          
          ### ⚠️ Warning
          Your account is still not safe from bans. Follow the [safety guide](https://themaphack.com) before using 【turn1search2】.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
