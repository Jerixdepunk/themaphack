name: Build Themaphack NDK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target architecture (arm64-v8a or armeabi-v7a)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a

env:
  TARGET_ARCH: ${{ github.event.inputs.architecture || 'arm64-v8a' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b
        add-to-path: true
        local-cache: true

    - name: Verify header guards
      run: |
        echo "Checking for missing #pragma once in header files..."
        MISSING=0
        find jni/ -name "*.h" -type f | while read -r file; do
          if ! grep -q "#pragma once" "$file"; then
            echo "❌ Missing #pragma once: $file"
            MISSING=1
          fi
        done
        if [ "$MISSING" -eq 1 ]; then
          echo ""
          echo "Some header files are missing #pragma once!"
          echo "This will cause 'redefinition' errors during compilation."
          echo "Please add #pragma once to the top of each file listed above."
          exit 1
        else
          echo "✅ All header files have #pragma once"
        fi

    - name: Prepare build directories
      run: |
        mkdir -p libs/${TARGET_ARCH}
        mkdir -p obj/local/${TARGET_ARCH}

    - name: Build with ndk-build
      working-directory: .
      run: |
        $ANDROID_NDK_HOME/ndk-build \
          APP_ABI=${TARGET_ARCH} \
          NDK_PROJECT_PATH=. \
          NDK_OUT=./obj \
          NDK_LIBS_OUT=./libs \
          NDK_DEBUG=0 \
          V=1

    - name: Verify build artifacts
      run: |
        echo "Searching for built libraries..."
        find libs/ -type f -name "*.so" -exec ls -la {} \;
        
        if find libs/ -type f -name "libAkSoundEngine2.so" | grep -q "."; then
          echo "✅ Build successful! libAkSoundEngine2.so found."
        else
          echo "❌ Build failed! libAkSoundEngine2.so not found."
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: themaphack-${{ env.TARGET_ARCH }}
        path: |
          libs/${{ env.TARGET_ARCH }}/
        retention-days: 30

    - name: Create GitHub Release (on main branch)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          libs/${{ env.TARGET_ARCH }}/libAkSoundEngine2.so
        tag_name: v${{ github.run_number }}-${{ env.TARGET_ARCH }}
        name: Release ${{ env.TARGET_ARCH }} ${{ github.run_number }}
        body: |
          ## Themaphack Build ${{ github.run_number }}
          
          **Architecture:** ${{ env.TARGET_ARCH }}
          
          ### Installation
          1. Download `libAkSoundEngine2.so`
          2. Copy to `Android/data/com.mobile.legends/files/dragon2017/assets/comlibs/${{ env.TARGET_ARCH }}/`
          3. Rename original `libAkSoundEngine.bytes` to `libTMH.bytes`
          4. Rename `libAkSoundEngine2.so` to `libAkSoundEngine.bytes`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
