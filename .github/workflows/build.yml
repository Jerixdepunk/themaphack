name: Build Themaphack NDK (Debug)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target architecture (arm64-v8a or armeabi-v7a)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a

env:
  TARGET_ARCH: ${{ github.event.inputs.architecture || 'arm64-v8a' }}
  NDK_VERSION: r25b

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25b
        add-to-path: true
        local-cache: true

    - name: Debug - List jni directory structure
      run: |
        echo "=== JNI Directory Structure ==="
        find jni/ -type f -name "*.mk" -o -name "*.cpp" -o -name "*.h" -o -name "*.c" | head -50
        echo ""
        echo "=== Android.mk Content ==="
        cat jni/Android.mk
        echo ""
        echo "=== Application.mk Content ==="
        cat jni/Application.mk

    - name: Debug - Verify all source files exist
      run: |
        echo "=== Checking source files referenced in Android.mk ==="
        # Extract source files from Android.mk
        grep -o 'LOCAL_SRC_FILES := .*' jni/Android.mk | sed 's/LOCAL_SRC_FILES := //' | tr ' ' '\n' | while read -r file; do
          if [ -f "jni/$file" ]; then
            echo "✅ Found: $file"
          else
            echo "❌ Missing: $file"
          fi
        done

    - name: Prepare build environment
      run: |
        # Create build directories at root level
        mkdir -p libs/${TARGET_ARCH}
        mkdir -p obj/local/${TARGET_ARCH}

    - name: Build with ndk-build (Verbose Debug Mode)
      working-directory: .
      run: |
        # Run ndk-build with maximum verbosity
        $ANDROID_NDK_HOME/ndk-build \
          APP_ABI=${TARGET_ARCH} \
          NDK_PROJECT_PATH=. \
          NDK_OUT=./obj \
          NDK_LIBS_OUT=./libs \
          NDK_DEBUG=1 \
          V=1 \
          2>&1 | tee build.log

        # Check if build succeeded
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "❌ Build failed with exit code ${PIPESTATUS[0]}"
          echo "=== Last 50 lines of build log ==="
          tail -50 build.log
          exit 1
        fi

    - name: Verify build artifacts
      run: |
        echo "=== Searching for built libraries ==="
        find libs/ -type f -name "*.so" -exec ls -la {} \;
        
        # Check specifically for libAkSoundEngine2.so
        if find libs/ -type f -name "libAkSoundEngine2.so" | grep -q "."; then
          echo "✅ Build successful! libAkSoundEngine2.so found."
        else
          echo "❌ Build failed! libAkSoundEngine2.so not found."
          echo "=== All files in libs directory ==="
          find libs/ -type f -exec ls -la {} \;
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: themaphack-${{ env.TARGET_ARCH }}-${{ github.sha }}
        path: |
          libs/
          build.log
        retention-days: 30

    - name: Create GitHub Release (on main branch)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          libs/${{ env.TARGET_ARCH }}/libAkSoundEngine2.so
        tag_name: v${{ github.run_number }}-${{ env.TARGET_ARCH }}
        name: Release ${{ env.TARGET_ARCH }} ${{ github.run_number }}
        body: |
          ## Themaphack Build ${{ github.run_number }}
          
          **Architecture:** ${{ env.TARGET_ARCH }}
          **Commit:** ${{ github.sha }}
          
          ### Installation
          1. Download `libAkSoundEngine2.so`
          2. Copy to `Android/data/com.mobile.legends/files/dragon2017/assets/comlibs/${{ env.TARGET_ARCH }}/`
          3. Rename original `libAkSoundEngine.bytes` to `libTMH.bytes`
          4. Rename `libAkSoundEngine2.so` to `libAkSoundEngine.bytes`
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
