name: Build with NDK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually trigger the build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c # You can change this to another version if needed

    - name: Build with ndk-build
      run: |
        # Make the compile script executable and run it
        chmod +x compile.sh
        ./compile.sh
      env:
        # Pass the NDK path to the environment so compile.sh can find it
        NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

    - name: Upload .so files
      uses: actions/upload-artifact@v4
      with:
        name: themaphack-libs
        path: libs/**/*.so # This path may vary depending on where the build outputs the files
