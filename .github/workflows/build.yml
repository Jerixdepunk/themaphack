name: Build with NDK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1  # <-- FIXED the typo here!
      with:
        ndk-version: r25c

    - name: Build the hack
      run: |
        # Call ndk-build directly (bypassing the broken compile.sh)
        $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. NDK_APPLICATION_MK=jni/Application.mk

    - name: Upload .so files
      uses: actions/upload-artifact@v4
      with:
        name: themaphack-libs
        path: libs/**/*.so
