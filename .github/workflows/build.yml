name: Fix Header Guards

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  fix-headers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Add #pragma once to all header files
      run: |
        # Find all .h files in jni directory
        find jni/ -name "*.h" -type f | while read -r file; do
          # Check if file already has #pragma once
          if ! grep -q "#pragma once" "$file"; then
            echo "Adding #pragma once to: $file"
            # Create temp file with #pragma once at the top
            echo "#pragma once" > temp_header.h
            cat "$file" >> temp_header.h
            mv temp_header.h "$file"
          else
            echo "Already has #pragma once: $file"
          fi
        done
        
        # Show changes
        git diff --stat
    
    - name: Commit and push changes
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add jni/
        git commit -m "Add #pragma once to all header files - fixes redefinition errors" || echo "No changes to commit"
        git push
